name: Build LineageOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Bersihkan Storage Maksimal
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 2. Install Dependencies & Repo
        run: |
          df -h
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 3. Sync Source LineageOS
        run: |
          mkdir -p ~/lineage && cd ~/lineage
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
          repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)
        
      - name: 4. Clone Device & Vendor Tree
        run: |
          cd ~/lineage
          git clone --depth=1 https://github.com/Yazz246/android_device_itel_A665L -b main device/itel/A665L
          git clone --depth=1 https://github.com/Yazz246/android_vendor_itel_A665L -b main vendor/itel/A665L
          python3 - << 'EOF'
          import glob, os, re, shutil

          vdir = "vendor/itel/A665L"
          p = f"{vdir}/Android.bp"

          aosp_mods = set()
          skip_mk_prefixes = (
              "vendor/", "device/", "hardware/qcom", "hardware/broadcom",
              "hardware/nxp", "hardware/ti", "hardware/amlogic", "hardware/intel"
          )
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".") and d != "out"]
              rel_root = os.path.relpath(root, ".")
              if rel_root.startswith(("vendor/itel", "device/itel")):
                  continue
              if "Android.bp" in files:
                  bp_file = os.path.join(root, "Android.bp")
                  try:
                      txt = open(bp_file, errors="ignore").read()
                      names = re.findall(r'\bname\s*:\s*"([^"]+)"', txt)
                      aosp_mods.update(names)
                      if "aidl_interface" in txt:
                          for n in names:
                              for suf in ["-cpp", "-ndk", "-ndk_platform", "-java", "-rust"]:
                                  aosp_mods.add(n + suf)
                              for v in range(1, 6):
                                  for suf in ["-ndk", "-cpp", "-ndk_platform"]:
                                      aosp_mods.add(f"{n}-V{v}{suf}")
                  except Exception:
                      pass
              if "Android.mk" in files and not rel_root.startswith(skip_mk_prefixes):
                  mk_file = os.path.join(root, "Android.mk")
                  try:
                      txt = open(mk_file, errors="ignore").read()
                      mk_names = re.findall(r'(?m)^\s*LOCAL_MODULE\s*:=\s*([^\s#\\$]+)', txt)
                      aosp_mods.update(mk_names)
                  except Exception:
                      pass

          blocks = []
          cur = []
          depth = 0
          for line in open(p):
              cur.append(line)
              clean = line.split("//")[0]
              depth += clean.count("{") - clean.count("}")
              if depth <= 0 and cur:
                  blocks.append("".join(cur))
                  cur = []
                  depth = 0
          if cur:
              blocks.append("".join(cur))

          seen = {}
          removed = []
          kept_blocks = []
          for blk in blocks:
              m = re.search(r'(?m)^(\s*name:\s*")([^"]+)(".*)$', blk)
              if m:
                  mod_name = m.group(2)
                  if mod_name in aosp_mods:
                      removed.append(mod_name)
                      continue
                  if mod_name in seen:
                      seen[mod_name] += 1
                      new_name = f"{mod_name}_dup_{seen[mod_name]}"
                      blk = re.sub(r'(?m)^(\s*name:\s*")([^"]+)(".*)$', rf'\g<1>{new_name}\g<3>', blk, count=1)
                  else:
                      seen[mod_name] = 1
              kept_blocks.append(blk)

          print("Modul bentrok AOSP/LineageOS yang dihapus:", removed)
          content = "".join(kept_blocks)

          for mk_path in glob.glob(f"{vdir}/**/*.mk", recursive=True):
              mk_txt = open(mk_path).read()
              for rmod in removed:
                  mk_txt = re.sub(rf'(?m)^\s*{re.escape(rmod)}\s*\\?\s*\n', '', mk_txt)
              open(mk_path, "w").write(mk_txt)

          def add_prebuilt(mod_name, rel32, rel64):
              targets = []
              if rel32:
                  targets.append(f'        android_arm: {{\n            srcs: ["{rel32}"],\n        }},')
              if rel64:
                  targets.append(f'        android_arm64: {{\n            srcs: ["{rel64}"],\n        }},')
              if not targets:
                  return ""
              multilib = "both" if (rel32 and rel64) else ("64" if rel64 else "32")
              return (
                  f'\ncc_prebuilt_library_shared {{\n'
                  f'    name: "{mod_name}",\n'
                  f'    owner: "itel",\n'
                  f'    strip: {{\n        none: true,\n    }},\n'
                  f'    target: {{\n' + "\n".join(targets) + '\n    },\n'
                  f'    compile_multilib: "{multilib}",\n'
                  f'    check_elf_files: false,\n'
                  f'    prefer: true,\n'
                  f'    soc_specific: true,\n'
                  f'}}\n'
              )

          os.makedirs(f"{vdir}/proprietary/vendor/lib", exist_ok=True)
          os.makedirs(f"{vdir}/proprietary/vendor/lib64", exist_ok=True)

          if 'name: "libc++_shared"' not in content:
              arm32 = f"{vdir}/proprietary/vendor/lib/libc++_shared.so"
              arm64 = f"{vdir}/proprietary/vendor/lib64/libc++_shared.so"
              if not os.path.isfile(arm32):
                  m32 = sorted([s for s in glob.glob("prebuilts/**/armeabi-v7a/libc++_shared.so", recursive=True) if os.path.isfile(s)])
                  if m32:
                      shutil.copy(m32[-1], arm32)
              if not os.path.isfile(arm64):
                  m64 = sorted([s for s in glob.glob("prebuilts/**/arm64-v8a/libc++_shared.so", recursive=True) if os.path.isfile(s)])
                  if m64:
                      shutil.copy(m64[-1], arm64)
              if os.path.isfile(arm32) and os.path.isfile(arm64):
                  content += add_prebuilt("libc++_shared", "proprietary/vendor/lib/libc++_shared.so", "proprietary/vendor/lib64/libc++_shared.so")
              else:
                  content = re.sub(r'"libc\+\+_shared",?\s*', '', content)

          for pb in ["libprotobuf-cpp-full-3.9.1", "libprotobuf-cpp-lite-3.9.1"]:
              if f'name: "{pb}"' not in content:
                  f32 = [s for s in glob.glob(f"{vdir}/proprietary/**/lib/{pb}.so", recursive=True) if os.path.isfile(s)]
                  f64 = [s for s in glob.glob(f"{vdir}/proprietary/**/lib64/{pb}.so", recursive=True) if os.path.isfile(s)]
                  if f32 or f64:
                      r32 = os.path.relpath(f32[0], vdir) if f32 else None
                      r64 = os.path.relpath(f64[0], vdir) if f64 else None
                      content += add_prebuilt(pb, r32, r64)
                  else:
                      content = content.replace(f'"{pb}"', f'"{pb.replace("-3.9.1", "")}"')

          for rt, sub in [("libclang_rt.ubsan_standalone-aarch64-android", "lib64"), ("libclang_rt.ubsan_standalone-arm-android", "lib")]:
              if f'name: "{rt}"' not in content:
                  found = [s for s in glob.glob(f"{vdir}/proprietary/**/{rt}.so", recursive=True) if os.path.isfile(s)]
                  if not found:
                      src = sorted([s for s in glob.glob(f"prebuilts/clang/**/{rt}.so", recursive=True) if os.path.isfile(s)])
                      if src:
                          dst = f"{vdir}/proprietary/vendor/{sub}/{rt}.so"
                          shutil.copy(src[-1], dst)
                          found = [dst]
                  if found:
                      rel = os.path.relpath(found[0], vdir)
                      content += add_prebuilt(rt, rel if sub == "lib" else None, rel if sub == "lib64" else None)
                  else:
                      content = re.sub(rf'"{re.escape(rt)}",?\s*', '', content)

          open(p, "w").write(content)
          EOF
       
      - name: 5. Hapus .repo & Buat Swap RAM 16GB
        run: |
          rm -rf ~/lineage/.repo
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h
          free -h

      - name: 6. Mulai Build
        run: |
          cd ~/lineage
          export USE_CCACHE=0
          source build/envsetup.sh
          lunch lineage_A665L-userdebug
          m bacon -j$(nproc --all)

      - name: 7. Upload Hasil ROM (.zip)
        run: |
          cd ~/lineage/out/target/product/A665L
          ROM_FILE=$(ls lineage-*.zip | head -n 1)
          echo "Mengupload $ROM_FILE..."
          curl -T "$ROM_FILE" https://temp.sh/"$ROM_FILE"
          
