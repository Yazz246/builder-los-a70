name: Build LineageOS

on:
  workflow_dispatch:

concurrency:
  group: lineage-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Bersihkan Storage Maksimal
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 2. Install Dependencies & Repo
        run: |
          df -h
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 3. Sync Source LineageOS
        run: |
          mkdir -p ~/lineage && cd ~/lineage
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
          repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)

      - name: 4. Clone Device & Vendor Tree
        run: |
          cd ~/lineage
          git clone --depth=1 https://github.com/Yazz246/android_device_itel_A665L -b main device/itel/A665L
          git clone --depth=1 https://github.com/Yazz246/android_vendor_itel_A665L -b main vendor/itel/A665L

      - name: 5. Hapus .repo, Hemat Storage & Pindah Swap ke /mnt
        run: |
          cd ~/lineage
          python3 .repo/repo/repo manifest -o - -r > /tmp/saved_manifest.xml
          rm -rf ~/lineage/.repo
          mkdir -p ~/lineage/.repo/repo
          mv /tmp/saved_manifest.xml ~/lineage/.repo/saved_manifest.xml
          cat << 'EOF' > ~/lineage/.repo/repo/repo
          import os, sys
          manifest = os.path.join(os.path.dirname(os.path.dirname(os.path.abspath(__file__))), "saved_manifest.xml")
          with open(manifest, "r") as f:
              sys.stdout.write(f.read())
          EOF
          rm -rf ~/lineage/developers
          rm -rf ~/lineage/docs
          rm -rf ~/lineage/cts
          rm -rf ~/lineage/prebuilts/remoteexecution-client
          rm -rf ~/lineage/prebuilts/gradle-plugin
          rm -rf ~/lineage/prebuilts/maven_repo
          rm -rf ~/lineage/prebuilts/ndk
          rm -rf ~/lineage/prebuilts/*/darwin-x86
          rm -rf ~/lineage/prebuilts/*/*/darwin-x86
          rm -rf ~/lineage/prebuilts/android-emulator
          rm -rf ~/lineage/prebuilts/qemu-kernel
          rm -rf ~/lineage/prebuilts/gcc/linux-x86/x86
          rm -rf ~/lineage/prebuilts/gcc/linux-x86/mips
          rm -rf ~/lineage/prebuilts/gcc/linux-x86/riscv64
          sudo rm -rf /var/lib/apt/lists/* /var/cache/* /usr/share/doc/* /usr/share/man/*
          sudo rm -rf /usr/share/swift /usr/share/miniconda /usr/local/share/powershell /usr/local/share/chromium /usr/local/google-cloud-sdk /usr/local/aws* /usr/local/julia*
          sudo sysctl vm.swappiness=10
          MNT_AVAIL_GB=$(df -BG --output=avail /mnt | tail -n 1 | tr -dc '0-9')
          SWAP_GB=$(( MNT_AVAIL_GB > 2 ? MNT_AVAIL_GB - 1 : 0 ))
          if [ "$SWAP_GB" -ge 4 ]; then
            sudo fallocate -l "${SWAP_GB}G" /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          else
            sudo fallocate -l 10G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          df -h
          free -h

      - name: 6. Mulai Build
        run: |
          cd ~/lineage
          export USE_CCACHE=0
          export WITH_DEXPREOPT=false
          export DONT_DEXPREOPT_PREBUILTS=true
          export PRODUCT_MINIMIZE_JAVA_DEBUG_INFO=true
          export SKIP_ABI_CHECKS=true
          export _JAVA_OPTIONS="-Xmx4g"
          source build/envsetup.sh
          lunch lineage_A665L-userdebug
          GOGC=30 m nothing -j1
          GOGC=50 m bacon -j2 2>&1 | tee /tmp/build.log || { echo "=== 100 BARIS LOG TERAKHIR ==="; tail -n 100 /tmp/build.log; exit 1; }

      - name: 7. Upload Hasil ROM (.zip)
        run: |
          cd ~/lineage/out/target/product/A665L
          ROM_FILE=$(ls lineage-*.zip | head -n 1)
          echo "Mengupload $ROM_FILE..."
          curl -T "$ROM_FILE" https://temp.sh/"$ROM_FILE"
