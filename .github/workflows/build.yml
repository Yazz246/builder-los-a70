name: Build LineageOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Bersihkan Storage Maksimal
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 2. Install Dependencies & Repo
        run: |
          df -h
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 3. Sync Source LineageOS
        run: |
          mkdir -p ~/lineage && cd ~/lineage
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
          repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)

      - name: 4. Clone Device & Vendor Tree
        run: |
          cd ~/lineage
          git clone --depth=1 https://github.com/Yazz246/android_device_itel_A665L -b main device/itel/A665L
          git clone --depth=1 https://github.com/Yazz246/android_vendor_itel_A665L -b main vendor/itel/A665L
          python3 - << 'EOF'
          import glob, os, re, shutil

          p = "vendor/itel/A665L/Android.bp"
          seen = {}
          out = []
          for line in open(p):
              m = re.match(r'^(\s*name:\s*")([^"]+)(".*)$', line)
              if m and m.group(2) in seen:
                  seen[m.group(2)] += 1
                  line = f"{m.group(1)}{m.group(2)}_dup_{seen[m.group(2)]}{m.group(3)}\n"
              elif m:
                  seen[m.group(2)] = 1
              out.append(line)
          content = "".join(out)

          if 'name: "libc++_shared"' not in content:
              os.makedirs("vendor/itel/A665L/proprietary/vendor/lib", exist_ok=True)
              os.makedirs("vendor/itel/A665L/proprietary/vendor/lib64", exist_ok=True)
              arm32 = "vendor/itel/A665L/proprietary/vendor/lib/libc++_shared.so"
              arm64 = "vendor/itel/A665L/proprietary/vendor/lib64/libc++_shared.so"
              if not os.path.exists(arm32):
                  m32 = glob.glob("prebuilts/**/armeabi-v7a/libc++_shared.so", recursive=True)
                  if m32:
                      shutil.copy(m32[0], arm32)
              if not os.path.exists(arm64):
                  m64 = glob.glob("prebuilts/**/arm64-v8a/libc++_shared.so", recursive=True)
                  if m64:
                      shutil.copy(m64[0], arm64)
              if os.path.exists(arm32) and os.path.exists(arm64):
                  content += '''
          cc_prebuilt_library_shared {
              name: "libc++_shared",
              owner: "itel",
              strip: {
                  none: true,
              },
              target: {
                  android_arm: {
                      srcs: ["proprietary/vendor/lib/libc++_shared.so"],
                  },
                  android_arm64: {
                      srcs: ["proprietary/vendor/lib64/libc++_shared.so"],
                  },
              },
              compile_multilib: "both",
              check_elf_files: false,
              prefer: true,
              soc_specific: true,
          }
          '''
              else:
                  content = re.sub(r'^\s*"libc\+\+_shared",?\s*\n', '', content, flags=re.M)

          open(p, "w").write(content)
          EOF

      - name: 5. Hapus .repo & Buat Swap RAM 16GB
        run: |
          rm -rf ~/lineage/.repo
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h
          free -h

      - name: 6. Mulai Build
        run: |
          cd ~/lineage
          export USE_CCACHE=0
          source build/envsetup.sh
          lunch lineage_A665L-userdebug
          m bacon -j$(nproc --all)

      - name: 7. Upload Hasil ROM (.zip)
        run: |
          cd ~/lineage/out/target/product/A665L
          ROM_FILE=$(ls lineage-*.zip | head -n 1)
          echo "Mengupload $ROM_FILE..."
          curl -T "$ROM_FILE" https://temp.sh/"$ROM_FILE"
          
